channel:
- access:
  - ZTF_PUB
  name: wise
  policy: []
  version: 0
mongo:
  prefix: feets_bright
  reset: false
name: agn_variability_features
task:
- config:
    compiler_opts: TiCompilerOptions
    directives:
    - channel: wise
      filter:
        unit: TimewiseFilter
        config:
          n_visits: 20
      ingest:
        mux:
          combine:
          - state_t2:
            - unit: T2StackVisits
            - unit: T2FeetsTimewise
              config:
                t2_dependency:
                  - unit: T2StackVisits
                single_band_features:
                  - Autocor_length
                  - InverseEta
                  - ExcessVariance
                  - Mean
                  - Std
                  - ReducedChi2
                  - NPoints
                  - BeyondNStd
                  - WeightedBeyondNStd
                  - Gskew
                  - Skew
                  - PercentDiffPercentile
                  - Roms
                  - StructureFunction_index_21
                  - StructureFunction_index_31
                  - StructureFunction_index_32
                  - AndersonDarling
                multi_band_features:
                  - PearsonsR
                  - RedderWhenBrighter0
                  - RedderWhenBrighter1
                  - StetsonL
                  - InverseEtaColor
                  - BrightestColor
                  - SecondBrightestMeanColor
                  - ThirdBrightestMeanColor
            unit: T1SimpleCombiner
          unit: TiMongoMuxer
    iter_max: 5000000
    shaper: TiDataPointShaper
    supplier:
      config:
        dpid: hash
        loader:
          config:
            timewise_config_file: $AIRGNSOURCE/airgn/desi/desi_agn_value_added_catalog.yml
            stock_id_column_name: orig_id
          unit: TimewiseFileLoader
      unit: TimewiseAlertSupplier
  multiplier: 1
  title: t0
  template:
    live:
      - resolve_run_time_aliases
      - hash_t2_config
  unit: AlertConsumer

- config:
    log_profile: default
  multiplier: 1
  title: t2
  unit: T2Worker

- title: XGB
  unit: T3Processor
  config:
    raise_exc: true
    supply:
      unit: T3DefaultBufferSupplier
      config:
        select:
          unit: T3StockSelector
          config:
            channel: "wise"
        load:
          unit: T3SimpleDataLoader
          config:
            directives:
              - T2DOC
              - STOCK
            channel: "wise"
        complement:
          - unit: T3InputComplementer
            config:
              db_name: "desi_agn_vac"
              col_name: "input"
        chunk_size: 10000
    stage:
      unit: T3SequentialStager
      config:
        execute:
          - unit: AGNVarXGB
            config: &xgb_full
              plot_dir: $AIRGNDATA/desi_value_added_catalog/plots/feets_bright/xgb
              mplstyle: airgn.paper
              n_estimators: 100
              iter_max: 50000
              smote: false
              learning_rate: 0.1
              exclude_features:
                - Mean
                - NPoints
                - Std
              n_cpu: 20
          - unit: AGNVarXGB
            config: &xgb_no_wise_agn
              plot_dir: $AIRGNDATA/desi_value_added_catalog/plots/feets_bright/xgb_no_wise_agn
              mplstyle: airgn.paper
              n_estimators: 1000
              iter_max: 50000
              smote: false
              learning_rate: 0.1
              drop_wise_agn: true
              exclude_features:
                - Mean
                - NPoints
                - Std
              n_cpu: 20

- title: VisualizeFeatures
  unit: T3Processor
  config:
    raise_exc: true
    supply:
      unit: T3DefaultBufferSupplier
      config:
        select:
          unit: T3StockSelector
          config:
            channel: "wise"
        load:
          unit: T3SimpleDataLoader
          config:
            directives:
              - T2DOC
              - STOCK
            channel: "wise"
        complement:
          - unit: T3InputComplementer
            config:
              db_name: "desi_agn_vac"
              col_name: "input"
        chunk_size: 10000
    stage:
      unit: T3SequentialStager
      config:
        execute:
          - unit: FeetsOfAGN
            config:
              path: $AIRGNDATA/desi_value_added_catalog/plots/feets_bright
              input_mongo_db_name: desi_agn_vac
              n_points_bins: [ 20, 30 ]
              exclude_features_fit:
                - Mean
                - NPoints
                - Std
              exclude_features_corner:
                - NPoints
          - unit: FeetsOfAGN
            config:
              path: $AIRGNDATA/desi_value_added_catalog/plots/feets_bright_no_wise_agn
              input_mongo_db_name: desi_agn_vac
              n_points_bins: [ 20, 30 ]
              drop_wise_agn: true
              exclude_features_fit:
                - Mean
                - NPoints
                - Std
              exclude_features_corner:
                - NPoints
          - unit: FeetsOfAGN
            config:
              path: $AIRGNDATA/desi_value_added_catalog/plots/feets_bright_no_autocorr
              input_mongo_db_name: desi_agn_vac
              n_points_bins: [ 20, 30 ]
              exclude_features_fit:
                - Mean
                - NPoints
                - Autocor_length
                - Std
              exclude_features_corner:
                - Autocor_length
                - NPoints
                - Std
          - unit: FeetsOfAGN
            config:
              path: $AIRGNDATA/desi_value_added_catalog/plots/feets_bright_minimal
              input_mongo_db_name: desi_agn_vac
              n_points_bins: [ 20, 30 ]
              exclude_features_fit:
                - Autocor_length
                - InverseEta
                - ExcessVariance
                - Mean
                - NPoints
                - RedderWhenBrighter0
                - RedderWhenBrighter1
                - StetsonL
                - InverseEtaColor
                - Std
              exclude_features_corner:
                - Autocor_length
                - InverseEta
                - ExcessVariance
                - NPoints
                - RedderWhenBrighter0
                - RedderWhenBrighter1
                - StetsonL
                - InverseEtaColor
                - Std

