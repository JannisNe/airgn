channel:
- access:
  - ZTF_PUB
  name: legacy_survey
  policy: []
  version: 0
- access:
    - ZTF_PUB
  name: timewise
  policy: [ ]
  version: 0
mongo:
  prefix: desi_targetphot
  reset: false
name: desi_targetphot


task:
- config:
    compiler_opts: TiCompilerOptions
    directives:
    - channel: legacy_survey
      filter:
        unit: LegacySurveyWISEFilter
        config:
          min_exp_per_visit: 8
          min_detections: 10
      ingest:
        mux:
          combine:
          - state_t2:
            - unit: T2MaggyToFluxDensity
            - unit: T2FeetsTimewise
              config:
                time_col: "LC_MJD_{band}"
                t2_dependency:
                  - unit: T2MaggyToFluxDensity
                single_band_features:
                  - Autocor_length
                  - InverseEta
                  - ExcessVariance
                  - Mean
                  - Std
                  - ReducedChi2
                  - NPoints
                  - BeyondNStd
                  - WeightedBeyondNStd
                  - Gskew
                  - Skew
                  - PercentDiffPercentile
                  - Roms
                  - StructureFunction_index_21
                  - StructureFunction_index_31
                  - StructureFunction_index_32
                  - AndersonDarling
                multi_band_features:
                  - PearsonsR
                  - RedderWhenBrighter0
                  - RedderWhenBrighter1
                  - StetsonL
                  - InverseEtaColor
                  - BrightestColor
                  - SecondBrightestMeanColor
                  - ThirdBrightestMeanColor
            unit: T1SimpleCombiner
          unit: TiMongoMuxer
          config:
            projection:
              _id: 0
              id: 1
              tag: 1
              channel: 1
              stock: 1
              body.TARGETID: 1
              body.ra: 1
              body.dec: 1
              body.LC_FLUX_W1: 1
              body.LC_FLUX_W2: 1
              body.LC_FLUX_IVAR_W1: 1
              body.LC_FLUX_IVAR_W2: 1
              body.LC_NOBS_W1: 1
              body.LC_NOBS_W2: 1
              body.LC_MJD_W1: 1
              body.LC_MJD_W2: 1
            unique_key: [TARGETID, LC_MJD_W1]
            channel: legacy_survey
    shaper: LegacySurveyDatapointShaper
    iter_max: 1000000
    supplier:
      config:
        dpid: hash
        make_stock_from_columns:
          - TARGETID
        loader:
          config:
            dr: 9
            sv: 0
            target_map_file: $AIRGNDATA/desi_targetphot/LSDR9_phot_iron_v1.1_extracted_minimal.fits
            column_mapping:
              OBJID: BRICK_OBJID
            cache_dir: $AIRGNDATA/legacy_survey/desi_targetphot_cache
            download_if_missing: true
          unit: LegacySurveyBrickDESITargetIDLoader
      unit: LegacySurveySupplier
  multiplier: 1
  title: legacy_survey
  template:
    live:
      - resolve_run_time_aliases
      - hash_t2_config
  unit: AlertConsumer


- config:
    log_profile: default
  multiplier: 1
  title: t2
  unit: T2Worker

- title: AnalyseFeatures
  unit: T3Processor
  config:
    raise_exc: true
    supply:
      unit: T3DefaultBufferSupplier
      config:
        select:
          unit: T3StockSelector
          config:
            channel: "legacy_survey"
        load:
          unit: T3SimpleDataLoader
          config:
            directives:
              - T2DOC
              - STOCK
            channel: "legacy_survey"
        complement:
          - unit: T3InputComplementer
            config:
              db_name: "desi_agn_vac"
              col_name: "input"
        chunk_size: 10000
    stage:
      unit: T3SequentialStager
      config:
        execute:
          - unit: AGNVarXGB
            config: &xgb_full
              plot_dir: $AIRGNDATA/desi_value_added_catalog_targetphot/plots/feets_bright/xgb
              n_estimators: 100
              iter_max: 50000
              smote: false
              learning_rate: 0.1
              exclude_features:
                - Mean
                - NPoints
                - Std
              n_cpu: 20
          - unit: AGNVarXGB
            config: &xgb_no_wise_agn
              plot_dir: $AIRGNDATA/desi_value_added_catalog_targetphot/plots/feets_bright/xgb_no_wise_agn
              n_estimators: 1000
              iter_max: 50000
              smote: false
              learning_rate: 0.1
              drop_wise_agn: true
              exclude_features:
                - Mean
                - NPoints
                - Std
              n_cpu: 20
          - unit: FeetsOfAGN
            config:
              path: $AIRGNDATA/desi_value_added_catalog_targetphot/plots/feets_bright
              input_mongo_db_name: desi_agn_vac
              n_points_bins: [10, 20]
              corner: false
              exclude_features_fit:
                - Mean
                - NPoints
                - Std
              exclude_features_corner:
                - NPoints
          - unit: FeetsOfAGN
            config:
              path: $AIRGNDATA/desi_value_added_catalog_targetphot/plots/feets_bright_no_wise_agn
              input_mongo_db_name: desi_agn_vac
              n_points_bins: [ 10, 20 ]
              corner: false
              drop_wise_agn: true
              exclude_features_fit:
                - Mean
                - NPoints
                - Std
              exclude_features_corner:
                - NPoints
          - unit: FeetsOfAGN
            config:
              path: $AIRGNDATA/desi_value_added_catalog_targetphot/plots/feets_bright_no_autocorr
              input_mongo_db_name: desi_agn_vac
              n_points_bins: [ 10, 20 ]
              corner: false
              exclude_features_fit:
                - Mean
                - NPoints
                - Autocor_length
                - Std
              exclude_features_corner:
                - Autocor_length
                - NPoints
                - Std
          - unit: FeetsOfAGN
            config:
              path: $AIRGNDATA/desi_value_added_catalog_targetphot/plots/feets_bright_minimal
              input_mongo_db_name: desi_agn_vac
              n_points_bins: [ 10, 20 ]
              corner: false
              exclude_features_fit:
                - Autocor_length
                - InverseEta
                - ExcessVariance
                - Mean
                - NPoints
                - RedderWhenBrighter0
                - RedderWhenBrighter1
                - StetsonL
                - InverseEtaColor
                - Std
              exclude_features_corner:
                - Autocor_length
                - InverseEta
                - ExcessVariance
                - NPoints
                - RedderWhenBrighter0
                - RedderWhenBrighter1
                - StetsonL
                - InverseEtaColor
                - Std

- title: PlotLightcurvesXGBFull
  unit: T3Processor
  config:
    raise_exc: true
    supply:
      unit: T3DefaultBufferSupplier
      config:
        select:
          unit: T3StockSelector
          config:
            channel: "legacy_survey"
            custom: {'stock': {'$in': [39627568181152288, 39627760636790448, 39627603966957172, 39627899472448745, 39627562095214782, 39627742571926630, 39627772712197138, 39627857315501692, 39627778793938183]}}
        load:
          unit: T3SimpleDataLoader
          config:
            directives:
              - STOCK
              - T0
              - T1
              - T2
            channel: "legacy_survey"
        complement:
          - unit: T3TiedComplementer
            config:
              t3_dependency:
                unit: AGNVarXGB
                config: *xgb_full
              t3_dependency_data_field: body.probabilities
              t3_dependency_columns:
                - probability
                - agn
                - wise_agn
        chunk_size: 10000

    stage:
      unit: T3SequentialStager
      config:
        execute:
          - unit: PlotLightcurves
            config:
              base_dir: $AIRGNDATA/desi_value_added_catalog_targetphot/plots/lightcurves_xgb_full
              mplstyle: airgn.paper
              filename_extra_keys:
                - probability
                - agn
                - wise_agn

- title: PlotLightcurvesXGBNoWISEAGN
  unit: T3Processor
  config:
    raise_exc: true
    supply:
      unit: T3DefaultBufferSupplier
      config:
        select:
          unit: T3StockSelector
          config:
            channel: "legacy_survey"
            custom: {'stock': {'$in': [39627568181152288, 39627760636790448, 39627603966957172, 39627899472448745, 39627772712197138, 39627857315501692, 39627778793938183]}}
        load:
          unit: T3SimpleDataLoader
          config:
            directives:
              - STOCK
              - T0
              - T1
              - T2
            channel: "legacy_survey"
        complement:
          - unit: T3TiedComplementer
            config:
              t3_dependency:
                unit: AGNVarXGB
                config: *xgb_no_wise_agn
              t3_dependency_data_field: body.probabilities
              t3_dependency_columns:
                - probability
                - agn
                - wise_agn
        chunk_size: 10000

    stage:
      unit: T3SequentialStager
      config:
        execute:
          - unit: PlotLightcurves
            config:
              base_dir: $AIRGNDATA/desi_value_added_catalog_targetphot/plots/lightcurves_xgb_no_wise_agn
              mplstyle: airgn.paper
              filename_extra_keys:
                - probability
                - agn
                - wise_agn


- title: CompareXGBs
  unit: T3Processor
  config:
    raise_exc: true
    supply:
      unit: T3DefaultBufferSupplier
      config:
        select:
          unit: T3TiedSelector
          config:
            t3_dependency:
              unit: AGNVarXGB
              config: *xgb_no_wise_agn
            t3_dependency_data_field: body.probabilities
        load:
          unit: T3SimpleDataLoader
          config:
            directives:
              - STOCK
            channel:
              any_of:
              - "legacy_survey"
              - "timewise"
        complement:
          - unit: T3TiedComplementer
            config:
              t3_dependency:
                unit: AGNVarXGB
                config: *xgb_full
              t3_dependency_data_field: body.probabilities
              t3_dependency_columns:
                - probability
                - agn
                - wise_agn
              prepend_key: full
          - unit: T3TiedComplementer
            config:
              t3_dependency:
                unit: AGNVarXGB
                config: *xgb_no_wise_agn
              t3_dependency_data_field: body.probabilities
              t3_dependency_columns:
                - probability
                - agn
                - wise_agn
              prepend_key: nowise
        chunk_size: 10000

    stage:
      unit: T3SequentialStager
      config:
        execute:
          - unit: CompareAGNXGBResult
            config:
              prepended_keys:
                - full
                - nowise
              labels:
                - Full
                - "No WISE AGN"
              filename_base: $AIRGNDATA/desi_value_added_catalog_targetphot/plots/feets_bright/xgb_full_vs_no_wise_agn
              mplstyle: airgn.paper
