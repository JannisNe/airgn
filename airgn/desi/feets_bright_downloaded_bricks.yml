channel:
- access:
  - ZTF_PUB
  name: legacy_survey
  policy: []
  version: 0
- access:
    - ZTF_PUB
  name: timewise
  policy: [ ]
  version: 0
mongo:
  prefix: feets_bright_combined
  reset: false
name: compare_agn_variability_features_ls_timewise

task:
- config:
    compiler_opts: TiCompilerOptions
    directives:
    - channel: timewise
      filter:
        unit: TimewiseFilterDownloadedLSBricks
        config:
          n_visits: 20
          dr: 9
          sv: 0
      ingest:
        mux:
          combine:
          - state_t2:
            - unit: T2StackVisits
            - unit: T2FeetsTimewise
              config:
                t2_dependency:
                  - unit: T2StackVisits
                single_band_features: &singlebandfeatures
                  - Autocor_length
                  - InverseEta
                  - ExcessVariance
                  - Mean
                  - Std
                  - ReducedChi2
                  - NPoints
                  - BeyondNStd
                  - WeightedBeyondNStd
                  - Gskew
                  - Skew
                  - PercentDiffPercentile
                  - Roms
                  - StructureFunction_index_21
                  - StructureFunction_index_31
                  - StructureFunction_index_32
                  - AndersonDarling
                multi_band_features: &multibandfeatures
                  - PearsonsR
                  - RedderWhenBrighter0
                  - RedderWhenBrighter1
                  - StetsonL
                  - InverseEtaColor
                  - BrightestColor
                  - SecondBrightestMeanColor
                  - ThirdBrightestMeanColor
            unit: T1SimpleCombiner
          unit: TiMongoMuxer
          config:
            channel: timewise
    iter_max: 5000000
    shaper: TiDataPointShaper
    supplier:
      config:
        dpid: hash
        loader:
          config:
            timewise_config_file: $AIRGNSOURCE/airgn/desi/desi_agn_value_added_catalog.yml
            stock_id_column_name: orig_id
          unit: TimewiseFileLoader
      unit: TimewiseAlertSupplier
  multiplier: 1
  title: t0
  template:
    live:
      - resolve_run_time_aliases
      - hash_t2_config
  unit: AlertConsumer

- config:
    compiler_opts: TiCompilerOptions
    directives:
    - channel: legacy_survey
      filter:
        unit: LegacySurveyWISEFilter
        config:
          min_exp_per_visit: 8
          min_detections: 10
      ingest:
        mux:
          combine:
          - state_t2:
            - unit: T2MaggyToFluxDensity
            - unit: T2FeetsTimewise
              config:
                time_col: "LC_MJD_{band}"
                t2_dependency:
                  - unit: T2MaggyToFluxDensity
                single_band_features: *singlebandfeatures
                multi_band_features: *multibandfeatures
            unit: T1SimpleCombiner
          unit: TiMongoMuxer
          config:
            projection:
              _id: 0
              id: 1
              tag: 1
              channel: 1
              stock: 1
              body.TARGETID: 1
              body.ra: 1
              body.dec: 1
              body.LC_FLUX_W1: 1
              body.LC_FLUX_W2: 1
              body.LC_FLUX_IVAR_W1: 1
              body.LC_FLUX_IVAR_W2: 1
              body.LC_NOBS_W1: 1
              body.LC_NOBS_W2: 1
              body.LC_MJD_W1: 1
              body.LC_MJD_W2: 1
            unique_key: [TARGETID, LC_MJD_W1]
            channel: legacy_survey
    shaper: LegacySurveyDatapointShaper
    iter_max: 1000000
    supplier:
      config:
        dpid: hash
        make_stock_from_columns:
          - TARGETID
        loader:
          config:
            dr: 9
            sv: 0
            target_map_file: $AIRGNDATA/desi_targetphot/LSDR9_phot_iron_v1.1_extracted_minimal.fits
            column_mapping:
              OBJID: BRICK_OBJID
            cache_dir: $AIRGNDATA/legacy_survey/desi_targetphot_cache
            download_if_missing: false
          unit: LegacySurveyBrickDESITargetIDLoader
      unit: LegacySurveySupplier
  multiplier: 1
  title: legacy_survey
  template:
    live:
      - resolve_run_time_aliases
      - hash_t2_config
  unit: AlertConsumer

- config:
    log_profile: default
  multiplier: 1
  title: t2
  unit: T2Worker

- title: TimewiseXGB
  unit: T3Processor
  config:
    raise_exc: true
    supply:
      unit: T3DefaultBufferSupplier
      config:
        select:
          unit: T3StockSelector
          config:
            channel:
              all_of:
                - timewise
                - legacy_survey
        load:
          unit: T3SimpleDataLoader
          config:
            directives:
              - T2DOC
              - STOCK
            channel: "timewise"
        chunk_size: 10000
    stage:
      unit: T3SequentialStager
      config:
        execute:
          - unit: AGNVarXGB
            config: &timewisexgb
              plot_dir: $AIRGNDATA/desi_value_added_catalog/plots/feets_bright_combined_timewise/xgb_no_wise_agn
              estimators_pickle_file: $AIRGNDATA/desi_value_added_catalog/estimators/feets_bright_combined_timewise.pkl
              input_mongo_db_name: desi_agn_vac
              n_estimators: 50
              smote: true
              learning_rate: 0.1
              drop_wise_agn: true
              exclude_features:
                - Mean
                - NPoints
                - Std
              n_cpu: 20

- title: LegacySurveyXGB
  unit: T3Processor
  config:
    raise_exc: true
    supply:
      unit: T3DefaultBufferSupplier
      config:
        select:
          unit: T3StockSelector
          config:
            channel:
              all_of:
                - timewise
                - legacy_survey
        load:
          unit: T3SimpleDataLoader
          config:
            directives:
              - T2DOC
              - STOCK
            channel: "legacy_survey"
        chunk_size: 10000
    stage:
      unit: T3SequentialStager
      config:
        execute:
          - unit: AGNVarXGB
            config: &lsxgb
              plot_dir: $AIRGNDATA/desi_value_added_catalog/plots/feets_bright_combined_legacy_survey/xgb_no_wise_agn
              estimators_pickle_file: $AIRGNDATA/desi_value_added_catalog/estimators/feets_bright_combined_legacy_survey.pkl
              input_mongo_db_name: desi_agn_vac
              n_estimators: 1000
              smote: true
              learning_rate: 0.1
              drop_wise_agn: true
              exclude_features:
                - Mean
                - NPoints
                - Std
              n_cpu: 20


- title: Compare
  unit: T3Processor
  config:
    raise_exc: true
    supply:
      unit: T3DefaultBufferSupplier
      config:
        select:
          unit: T3StockSelector
          config:
            channel:
              - "legacy_survey"
              - "timewise"
        load:
          unit: T3SimpleDataLoader
          config:
            directives:
              - STOCK
            channel:
              - "legacy_survey"
              - "timewise"
        complement:
          - unit: T3TiedComplementer
            config:
              t3_dependency:
                unit: AGNVarXGB
                config: *timewisexgb
              t3_dependency_data_field: body.probabilities
              t3_dependency_columns:
                - probability
                - agn
                - wise_agn
              prepend_key: timewise
          - unit: T3TiedComplementer
            config:
              t3_dependency:
                unit: AGNVarXGB
                config: *lsxgb
              t3_dependency_data_field: body.probabilities
              t3_dependency_columns:
                - probability
                - agn
                - wise_agn
              prepend_key: ls
        chunk_size: 10000

    stage:
      unit: T3SequentialStager
      config:
        execute:
          - unit: CompareAGNXGBResult
            config:
              prepended_keys:
                - ls
                - timewise
              labels:
                - LegacySurvey
                - Timewise
              filename: $AIRGNDATA/desi_value_added_catalog_compare/plots/ls_vs_timewise_xgb_full.pdf
              mplstyle: airgn.paper
